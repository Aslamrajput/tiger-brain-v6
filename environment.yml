# Conda environment for Tiger Brain V19
# Mirrors requirements.txt so the CI Conda workflow can install dependencies.
name: tiger-brain
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pandas>=2.0.0
  - numpy>=1.24.0
  - requests>=2.31.0
  - pytest
  - flake8
  - pip
  - pip:
      - yfinance>=0.2.36
      - python-dotenv>=1.0.0
      - smartapi-python
      - pyotp
      - logzero
      - websocket-client
      - pycryptodome
      - apscheduler>=3.10.0
      # ML advisory ensemble (mirrors requirements.txt) — required by
      # pipeline/ml_engine.py and tests/test_ml_engine.py.
      - scikit-learn>=1.3.0
      - lightgbm>=4.0.0
      - xgboost>=2.0.0
      - joblib>=1.3.0
